<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="620" height="200" role="img" aria-label="Logo CodePlay" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6D5DF6"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <!-- Latar putih agar teks tetap terbaca di mode gelap -->
  <rect width="620" height="200" rx="24" fill="#FFFFFF"/>

  <!-- Ikon: kotak gradasi -->
  <rect x="20" y="30" width="140" height="140" rx="34" fill="url(#grad)"/>

  <!-- Kurung kode < > -->
  <path d="M50 78 L34 100 L50 122" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M130 78 L146 100 L130 122" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tombol Play di tengah -->
  <path d="M76 80 L76 120 L110 100 Z" fill="#FFC83D" stroke="#FFC83D" stroke-width="6" stroke-linejoin="round"/>

  <!-- Nama aplikasi -->
  <text x="185" y="108" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="64" font-weight="800">
    <tspan fill="#1E1B4B">Code</tspan><tspan fill="#6D5DF6">Play</tspan>
  </text>

  <!-- Tagline -->
  <text x="188" y="144" font-family="'Segoe UI', Poppins, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="2.5" fill="#64748B">LABORATORIUM CODING INTERAKTIF</text>
</svg>
